<!DOCTYPE html>
<html  lang="en" xmlns:th= "http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/main.css}" type="text/css"/>
    <title>Todo App</title>
    <style>
        .error {color: red;}
    </style>
</head>
<body>
<div class="contact-us">
    <CENTER>
    <h1>Mini Todo App</h1>
    </CENTER>
    <br>
    <form action="#"
            method="post"
          th:action="@{/todo/addTask}"
          th:object="${createTask}">
        <label class="error" th:text="${msg}"></label>
        <input id="description" placeholder="description" th:field="*{description}" type="text" minlength="5" maxlength="200" pattern="[^@#%&*${}()/><\][\\\x22,;|]+" title="@ # $ % ^ & * ( ) { } / \ NOT ALLOWED!" required />
        <input id="date" placeholder="Finish Date" th:field= "*{date}" type="date"  min="2019-12-31" required/>
        <label class="error" for="priority" th:if="${priorityError}" th:text="${msg}"></label>
        <select id="priority" name="priority" required th:if="${createTask.priority == null}">
            <option value="" disabled selected="selected">Select priority</option>
            <option th:each="priority : ${priorityOptions}"
                    th:value="${priority}"
                    th:text="${priority}">Priority</option>
        </select>
        <select id="priority" th:field="*{priority}" required
                th:unless="${createTask.priority == null}">
            <option th:each="priority : ${priorityOptions}"
                    th:value="${priority}"
                    th:text="${priority}">Priority</option>
        </select>
        <button type="submit">SAVE TASK</button>
    </form>

    <br>
    <table class="tasks-table">

        <thead>
        <tr>
            <th>TASK ID</th>
            <th>DESCRIPTION</th>
            <th>TARGET DATE</th>
            <th>PRIORITY</th>
            <th>EDIT</th>
            <th>DELETE</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task: ${taskList}">
            <td>
                <a th:text="${task.id}">
                </a>
            </td>

            <td th:text="${task.description}">description</td>
            <td th:text="${task.date}">date</td>
            <td th:text="${task.priority != null ? task.priority : 'Not set'}">priority</td>

            <td>
                <a class="abutton"
                   th:href="@{'/todo/updateTask/{id}' (id=${task.id})}" th:text="UPDATE">UPDATE</a>
            </td>
            <td>
                <a class="abutton"
                   th:href="@{'/todo/deleteTask/{id}' (id=${task.id})}" th:text="DELETE">DELETE</a>
            </td>
        </tr>
        </tbody>

    </table>
    <b><small>Fun Fact : &#128515;</small></b>
    <p>
        <small>
            The biggest lie I tell myself is:
            <i><u>"I don't need to write that down, I'll remember it."</u></i> &#128522; &#128541;
        </small>
    </p>
</div>
</body>
</html>
